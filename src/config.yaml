site:
  name: 'Imobiliária Saber'
  site: 'https://saber.imb.br/blog'
  base: '/'
  trailingSlash: false

apps:
blog:
  isBlogEnabled: true
  postsPerPage: 6
  
  # Definições de rotas com prefixo do blog
  post:
    permalink: '/blog/%slug%'
  
  category:
    disabled: false
    permalink: '/blog/category/%slug%'
    
  tag:
    disabled: false
    permalink: '/blog/tag/%slug%'